# Distraction space (io.github.danielkillenberger.distraction-space): load the
# hook that starts the distraction browser's streams muted while the hold is on.
# `distractions setup` writes this file; `setup --remove` deletes it.
wireplumber.components = [
  {
    name = distraction-space-hold-mute.lua, type = script/lua
    provides = custom.distraction-space.hold-mute
    # Loaded once the event source and the default metadata are up: existing
    # streams are the listener's, new ones are the hook's.
    requires = [ support.standard-event-source, metadata.default ]
  }
]

wireplumber.profiles = {
  main = {
    custom.distraction-space.hold-mute = optional
  }
}
