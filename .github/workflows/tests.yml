name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # tests/test_hypr.py runs the generated Hyprland Lua fragments through a
      # real interpreter; without lua5.4 those cases skip and CI never sees them.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4
      - run: python3 --version
      # Omit the README's PATH=/usr/bin:$PATH prefix: the runner has no
      # interpreter shim, and that prefix would put Ubuntu's system
      # /usr/bin/python3 ahead of the setup-python matrix interpreter.
      - run: python3 -m unittest discover -s tests
